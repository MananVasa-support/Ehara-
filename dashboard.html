<!DOCTYPE html>
<html lang="en">
<head>
<!-- AUTH GUARD — must be the FIRST thing inside <head> -->
<style id="auth-guard-hide">html { visibility: hidden; }</style>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="auth-config.js"></script>
<script src="auth.js"></script>
<script>window.Auth.guardPage({ redirectTo: 'index.html' });</script>
<!-- END AUTH GUARD -->

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ehara Engineering Pvt. Ltd. WORKSPACE</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; background: #fafafa; color: #111; }
  .wrap { max-width: 760px; margin: 80px auto; padding: 40px; background: #fff; border: 1px solid rgba(0,0,0,.08); border-radius: 14px; box-shadow: 0 18px 40px rgba(0,0,0,.05); }
  h1 { margin: 0 0 14px; font-size: 32px; }
  p  { color: #555; line-height: 1.6; }
  button { margin-top: 24px; background: #0a0a0a; color: #fff; border: 0; padding: 14px 22px; border-radius: 8px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>You're in.</h1>
    <p>https://script.google.com/a/macros/unleashed.in/s/AKfycbw4KeJD-ctISpzK1V9rexnYcKfx76Mg7IukyOPZZcqbpC53x-Y-M5QjKxycHppXBxUe/exec?page=form<strong>WORKSPACE</strong> page — just make sure the AUTH GUARD block at the top of <code>&lt;head&gt;</code> stays in place.</p>
    <button id="signout-btn">Sign out</button>
  </div>
  <script>
    document.getElementById('signout-btn').addEventListener('click', async function () {
      await window.Auth.signOut();
      window.location.replace('index.html');
    });
  </script>
</body>
</html>
