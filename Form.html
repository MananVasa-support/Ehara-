<style>
.eh-signout-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 14px;
  margin: 48px auto 24px;
  padding: 0 18px;
  flex-wrap: wrap;
}
.eh-dashboard-btn {
  padding: 11px 32px;
  background: linear-gradient(120deg, var(--blue-soft), var(--blue-deep));
  color: #fff;
  border: none;
  border-radius: 999px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(13,2,138,.28);
  transition: transform .15s, box-shadow .2s;
  display: inline-flex; align-items: center; gap: 7px;
}
.eh-dashboard-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 36px rgba(13,2,138,.42);
}
.eh-signout-btn {
  padding: 11px 32px;
  background: #fff;
  color: var(--red);
  border: 1.5px solid var(--red);
  border-radius: 999px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all .18s ease;
  box-shadow: var(--shadow-soft);
}
.eh-signout-btn:hover {
  background: var(--red);
  color: #fff;
  transform: translateY(-1px);
  box-shadow: 0 6px 18px rgba(197,35,48,0.30);
}
.eh-signout-btn:disabled { opacity: 0.6; cursor: wait; }
</style>
